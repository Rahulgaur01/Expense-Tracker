<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Expense Tracker</title>
  <div class="theme-toggle">

  <button id="themeBtn">
    <i class="fa-solid fa-moon"></i>
  </button>

</div> 

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Font Awesome -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <!-- Chart JS -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

  <div class="container">

    <h1 class="title">
  <span class="logo-icon">
    <i class="fa-solid fa-chart-line"></i>
  </span>

  <span class="logo-text">
    Fin Tracker
  </span>
</h1>

    <!-- Dashboard -->

    <div class="dashboard">

      <div class="card">
        <h2>Total Balance</h2>
        <p class="money balance" id="balance">₹0</p>
      </div>

      <div class="card">
        <h2>Total Income</h2>
        <p class="money income" id="income">₹0</p>
      </div>

      <div class="card">
        <h2>Total Expense</h2>
        <p class="money expense" id="expense">₹0</p>
      </div>

    </div>

    <!-- Main Section -->

    <div class="main">

      <!-- Form -->

      <div class="form-section">

        <h2 class="section-title">Add Transaction</h2>

        <div class="input-group">
          <label>Title</label>
          <input type="text" id="title" placeholder="Enter title">
        </div>

        <div class="input-group">
          <label>Amount</label>
          <input type="number" id="amount" placeholder="Enter amount">
        </div>

        <div class="input-group">
          <label>Type</label>

          <select id="type">
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>

        </div>

        <div class="input-group">

          <label>Category</label>

          <select id="category">
            <option>Food</option>
            <option>Travel</option>
            <option>Shopping</option>
            <option>Bills</option>
            <option>Entertainment</option>
            <option>Salary</option>
          </select>

        </div>

        <button class="btn" onclick="addTransaction()">
          Add Transaction
        </button>

      </div>

      <!-- History -->

      <div class="history-section">

        <h2 class="section-title">Transaction History</h2>

        <div id="transactionList"></div>

      </div>

    </div>

    <!-- Chart -->

    <div class="chart-container">

      <h2 class="section-title">Expense Analytics</h2>

      <canvas id="expenseChart"></canvas>

    </div>

  </div>

  <!-- JavaScript -->
  <script src="script.js"></script>

</body>
</html>
